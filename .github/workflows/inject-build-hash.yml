name: Inject build hash

on:
  push:
    branches:
      - claude/exciting-cerf-1xq5na

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Replace __BUILD_HASH__ with short SHA
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD_HASH__/${SHORT_SHA}/g" index.html

      - name: Commit injected hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: inject build hash ${GITHUB_SHA:0:7} [skip ci]"
          git push
