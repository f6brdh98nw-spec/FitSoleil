<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitSoleil — Test Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0F0F13;color:#F0EEE8;font-size:13px;height:100vh;display:flex;flex-direction:column}
#top{padding:10px 16px;background:#0F0F13;border-bottom:0.5px solid #2C2C3A;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
h2{font-size:13px;font-weight:700;color:#F07C3A}
.subtitle{font-size:10px;color:#5A5860}
#main{display:flex;flex:1;overflow:hidden}
#panel{width:360px;flex-shrink:0;overflow-y:auto;border-right:0.5px solid #2C2C3A;padding:12px}
#frame-wrap{flex:1;position:relative;background:#111}
iframe{width:100%;height:100%;border:none;display:block}
.summary-bar{background:#1A1A22;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap}
.stat{text-align:center;min-width:36px}
.stat-n{font-size:15px;font-weight:700}
.stat-l{font-size:9px;color:#5A5860;margin-top:1px}
.prog-bar{background:#1A1A22;border-radius:99px;height:3px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;border-radius:99px;background:#F07C3A;transition:width 0.3s}
.prog-label{font-size:10px;color:#5A5860;margin-bottom:8px}
.ctrls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ctrl-btn{background:#1A1A22;border:0.5px solid #2C2C3A;border-radius:7px;color:#9A98A0;font-size:10px;padding:4px 9px;cursor:pointer;font-family:system-ui}
.ctrl-btn.orange{background:rgba(240,124,58,0.15);color:#F07C3A;border-color:rgba(240,124,58,0.3)}
.ctrl-btn.purple{background:rgba(192,132,252,0.15);color:#C084FC;border-color:rgba(192,132,252,0.3)}
.ctrl-btn.blue{background:rgba(96,165,250,0.15);color:#60A5FA;border-color:rgba(96,165,250,0.3)}
.ctrl-btn.red{background:rgba(248,113,113,0.15);color:#F87171;border-color:rgba(248,113,113,0.3)}
.ctrl-btn:disabled{opacity:0.4;cursor:not-allowed}
.section{margin-bottom:14px}
.section-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;padding-bottom:4px;border-bottom:0.5px solid #2C2C3A;display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px}
.test{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:0.5px solid #1A1A22;cursor:pointer}
.test:last-child{border-bottom:none}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #2C2C3A;background:#1A1A22;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:9px;font-weight:700;transition:all 0.15s}
.cb.pass{background:#4ADE80;border-color:#4ADE80;color:#0F0F13}
.cb.fail{background:rgba(248,113,113,0.2);border-color:#F87171;color:#F87171}
.cb.running{background:rgba(240,124,58,0.2);border-color:#F07C3A;color:#F07C3A}
.id{font-size:9px;color:#5A5860;flex-shrink:0;margin-top:2px;width:42px;font-family:monospace}
.label{font-size:11px;color:#9A98A0;line-height:1.4;flex:1}
.test.pass .label{color:#5A5860;text-decoration:line-through}
.test.fail .label{color:#F87171}
.test.running .label{color:#F07C3A}
.err-msg{font-size:9px;color:#F87171;margin-top:2px;font-family:monospace;line-height:1.4}
.badge{display:inline-block;font-size:8px;font-weight:700;padding:1px 4px;border-radius:99px;margin-left:3px;vertical-align:middle}
.b-auto{background:rgba(74,222,128,0.15);color:#4ADE80}
.b-manual{background:rgba(232,197,71,0.15);color:#E8C547}
.b-semi{background:rgba(96,165,250,0.15);color:#60A5FA}
.log-box{background:#1A1A22;border-radius:8px;padding:6px 8px;font-family:monospace;font-size:9px;color:#5A5860;max-height:90px;overflow-y:auto;margin-bottom:8px;line-height:1.6}
.log-line{display:block}
.log-line.ok{color:#4ADE80}
.log-line.err{color:#F87171}
.log-line.info{color:#9A98A0}
.comment-input{width:100%;background:#1A1A22;border:0.5px solid #2C2C3A;border-radius:5px;color:#9A98A0;font-size:9px;padding:3px 6px;font-family:system-ui;margin-top:3px;resize:none}
.comment-input:focus{outline:none;border-color:#5A5860}
.section-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.sf-btn{background:#1A1A22;border:0.5px solid #2C2C3A;border-radius:6px;color:#5A5860;font-size:9px;padding:3px 7px;cursor:pointer;font-family:system-ui}
.sf-btn.active{border-color:#F07C3A;color:#F07C3A;background:rgba(240,124,58,0.08)}
</style>
</head>
<body>
<div id="top">
  <div><h2>FitSoleil Test Runner</h2><p class="subtitle">AUTO = scripted &middot; SEMI = scripted + visual &middot; MANUAL = you verify</p></div>
  <div style="display:flex;gap:5px;flex-wrap:wrap">
    <button class="ctrl-btn orange" id="btn-run-all" onclick="runAll()">&#9654; Run auto</button>
    <button class="ctrl-btn blue" onclick="loadTestData()">&#128190; Load test data</button>
    <button class="ctrl-btn red" onclick="resetApp()">Reset app</button>
    <button class="ctrl-btn purple" onclick="exportResults()">&#128203; Copy report</button>
    <button class="ctrl-btn" onclick="clearResults()">Clear</button>
  </div>
</div>
<div id="main">
  <div id="panel">
    <div class="summary-bar">
      <div class="stat"><div class="stat-n" id="s-total" style="color:#F0EEE8">0</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" id="s-pass" style="color:#4ADE80">0</div><div class="stat-l">Pass</div></div>
      <div class="stat"><div class="stat-n" id="s-fail" style="color:#F87171">0</div><div class="stat-l">Fail</div></div>
      <div class="stat"><div class="stat-n" id="s-pct" style="color:#E8C547">0%</div><div class="stat-l">Auto %</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-label" id="prog-label">&mdash;</div>
    <div class="log-box" id="log-box"><span class="log-line info">Ready. Load app then run tests.</span></div>
    <div class="section-filter">
      <button class="sf-btn active" onclick="setSection('all',this)">All</button>
      <button class="sf-btn" onclick="setSection('C',this)">Core</button>
      <button class="sf-btn" onclick="setSection('F',this)">Food</button>
      <button class="sf-btn" onclick="setSection('N',this)">Nutrition</button>
      <button class="sf-btn" onclick="setSection('W',this)">Workout</button>
      <button class="sf-btn" onclick="setSection('P',this)">Progress</button>
      <button class="sf-btn" onclick="setSection('H',this)">Home</button>
      <button class="sf-btn" onclick="setSection('S',this)">Settings</button>
      <button class="sf-btn" onclick="setSection('fail',this)">Fails</button>
    </div>
    <div id="checklist"></div>
  </div>
  <div id="frame-wrap">
    <iframe id="app-frame" src="index.html" onload="onFrameLoad()"></iframe>
  </div>
</div>
<script>
var SECTIONS = [
  { id:'C', title:"Core infrastructure", color:"#9A98A0", tests:[
    {id:"C.01",type:"auto",label:"state object exists with required keys",
      run:function(a){var s=a.state;return s&&'logs'in s&&'targets'in s&&'profile'in s;}},
    {id:"C.02",type:"auto",label:"saveState() persists to localStorage fitsol_v2",
      run:function(a){a.saveState();var d=a.localStorage.getItem('fitsol_v2');return!!d&&d.length>10;}},
    {id:"C.03",type:"auto",label:"openModal / closeModal exist",
      run:function(a){return typeof a.openModal==='function'&&typeof a.closeModal==='function';}},
    {id:"C.04",type:"auto",label:"navigate() exists",
      run:function(a){return typeof a.navigate==='function';}},
    {id:"C.05",type:"auto",label:"navigate('workout') makes screen-workout active",
      run:function(a){a.navigate('workout');var el=a.document.getElementById('screen-workout');return el&&el.classList.contains('active');}},
    {id:"C.06",type:"auto",label:"navigate('nutrition') makes screen-nutrition active",
      run:function(a){a.navigate('nutrition');var el=a.document.getElementById('screen-nutrition');return el&&el.classList.contains('active');}},
    {id:"C.07",type:"auto",label:"navigate('progress') makes screen-progress active",
      run:function(a){a.navigate('progress');var el=a.document.getElementById('screen-progress');return el&&el.classList.contains('active');}},
    {id:"C.08",type:"auto",label:"showToast function exists",
      run:function(a){return typeof a.showToast==='function';}},
    {id:"C.09",type:"auto",label:"drawLineChart function exists",
      run:function(a){return typeof a.drawLineChart==='function';}},
    {id:"C.10",type:"auto",label:"calcAuto macro function exists and returns object",
      run:function(a){if(typeof a.calcAuto!=='function')return false;var r=a.calcAuto(2000,'balanced');return r&&'protein'in r&&'carbs'in r&&'fat'in r;}},
  ]},
  { id:'H', title:"Home screen", color:"#E8C547", tests:[
    {id:"H.01",type:"auto",label:"renderDashboard function exists",
      run:function(a){return typeof a.renderDashboard==='function';}},
    {id:"H.02",type:"auto",label:"getDayLog returns object with meals array",
      run:function(a){if(typeof a.getDayLog!=='function')return false;var d=a.getDayLog();return d&&Array.isArray(d.meals);}},
    {id:"H.03",type:"auto",label:"calcTotals returns object with calories",
      run:function(a){if(typeof a.calcTotals!=='function')return false;var r=a.calcTotals([{calories:500,protein:30,carbs:50,fat:20}]);return r&&typeof r.calories==='number';}},
    {id:"H.04",type:"auto",label:"toggleWater function exists",
      run:function(a){return typeof a.toggleWater==='function';}},
    {id:"H.05",type:"auto",label:"updateStreak function exists",
      run:function(a){return typeof a.updateStreak==='function';}},
    {id:"H.06",type:"semi",label:"Home screen renders macro rings and water grid",run:null},
    {id:"H.07",type:"semi",label:"Workout tile on home shows today's planned session",run:null},
    {id:"H.08",type:"manual",label:"Tapping workout tile navigates to workout or opens picker",run:null},
    {id:"H.09",type:"manual",label:"Date navigator changes the active date and re-renders",run:null},
    {id:"H.10",type:"manual",label:"Water grid: tapping a cup fills it, tapping again empties it",run:null},
  ]},
  { id:'F', title:"Food search", color:"#4ADE80", tests:[
    {id:"F.01",type:"auto",label:"initFoodSearch exists",
      run:function(a){return typeof a.initFoodSearch==='function';}},
    {id:"F.02",type:"auto",label:"executeFoodSearch exists",
      run:function(a){return typeof a.executeFoodSearch==='function';}},
    {id:"F.03",type:"auto",label:"searchFoodFiles exists and returns array",
      run:function(a){return typeof a.searchFoodFiles==='function'&&Array.isArray(a.searchFoodFiles('egg'));}},
    {id:"F.04",type:"auto",label:"searchFoodFiles('tuna') returns 3+ NZ results",
      run:function(a){var r=a.searchFoodFiles('tuna');return r&&r.length>=3;}},
    {id:"F.05",type:"auto",label:"searchFoodFiles('egg') returns results",
      run:function(a){var r=a.searchFoodFiles('egg');return r&&r.length>0;}},
    {id:"F.06",type:"auto",label:"_searchGen only increments in executeFoodSearch, not initFoodSearch",
      run:function(a){var b=a._searchGen||0;a.initFoodSearch&&a.initFoodSearch('food');return(a._searchGen||0)===b;}},
    {id:"F.07",type:"auto",label:"parseOpenFoodFacts exists and accepts array",
      run:function(a){return typeof a.parseOpenFoodFacts==='function'&&Array.isArray(a.parseOpenFoodFacts([],false));}},
    {id:"F.08",type:"semi",label:"Search 'tuna' — FOODfiles NZ results appear first with teal badge",run:null},
    {id:"F.09",type:"semi",label:"Search 'balsamic vinegar' — OFF results appear",run:null},
    {id:"F.10",type:"semi",label:"Search 'sealord' — Sealord products appear",run:null},
    {id:"F.11",type:"manual",label:"Open food modal 5+ times searching 'tuna' each time — OFF results persist every time",run:null},
    {id:"F.12",type:"manual",label:"Tap a food result — quantity entry opens automatically (no second tap needed)",run:null},
    {id:"F.13",type:"manual",label:"See more results button is green, loads more OFF results",run:null},
  ]},
  { id:'N', title:"Nutrition screen", color:"#4ADE80", tests:[
    {id:"N.01",type:"auto",label:"renderDashboard function exists (used by nutrition)",
      run:function(a){return typeof a.renderDashboard==='function';}},
    {id:"N.02",type:"auto",label:"getDayLog with date param returns log object",
      run:function(a){if(typeof a.getDayLog!=='function')return false;var r=a.getDayLog('2026-10-01');return r&&'meals'in r;}},
    {id:"N.03",type:"auto",label:"generateShoppingList function exists",
      run:function(a){return typeof a.generateShoppingList==='function';}},
    {id:"N.04",type:"auto",label:"openMealPlanSlot function exists",
      run:function(a){return typeof a.openMealPlanSlot==='function';}},
    {id:"N.05",type:"auto",label:"state.recipes is an array",
      run:function(a){return Array.isArray(a.state.recipes);}},
    {id:"N.06",type:"auto",label:"state.mealPlan exists (object or undefined, not null)",
      run:function(a){return a.state.mealPlan!==null;}},
    {id:"N.07",type:"semi",label:"Nutrition diary shows food entries from test data",run:null},
    {id:"N.08",type:"semi",label:"Macro totals update when food is logged",run:null},
    {id:"N.09",type:"semi",label:"Meal plan tab shows current week plan",run:null},
    {id:"N.10",type:"semi",label:"Recipe builder: add ingredients, macros update live",run:null},
    {id:"N.11",type:"manual",label:"Log a food: search, select, enter grams, confirm — appears in diary",run:null},
    {id:"N.12",type:"manual",label:"Remove a food from diary — disappears and macros update",run:null},
    {id:"N.13",type:"manual",label:"Save recipe — appears in Meals/Recipes tab",run:null},
    {id:"N.14",type:"manual",label:"Meal plan: assign a recipe to a slot, save, navigate away and back — persists",run:null},
    {id:"N.15",type:"manual",label:"Save meal plan as template, load on different week — fills correctly",run:null},
  ]},
  { id:'W', title:"Workout screen", color:"#F07C3A", tests:[
    {id:"W.01",type:"auto",label:"wkBeginSession exists",run:function(a){return typeof a.wkBeginSession==='function';}},
    {id:"W.02",type:"auto",label:"wkSelectExType exists",run:function(a){return typeof a.wkSelectExType==='function';}},
    {id:"W.03",type:"auto",label:"renderExerciseList is not empty stub",
      run:function(a){var f=a.renderExerciseList;return typeof f==='function'&&f.toString().length>50;}},
    {id:"W.04",type:"auto",label:"startPlan is not empty stub",
      run:function(a){var f=a.startPlan;return typeof f==='function'&&f.toString().length>50;}},
    {id:"W.05",type:"auto",label:"wkRenderPlans exists",run:function(a){return typeof a.wkRenderPlans==='function';}},
    {id:"W.06",type:"auto",label:"wkRenderHistory exists and not empty stub",
      run:function(a){var f=a.wkRenderHistory;return typeof f==='function'&&f.toString().length>50;}},
    {id:"W.07",type:"auto",label:"wkBeginSession creates _wkSession with exercises array",
      run:function(a){a.wkBeginSession({id:'t',name:'T',exercises:[]});return a._wkSession&&Array.isArray(a._wkSession.exercises);}},
    {id:"W.08",type:"auto",label:"Submit Lift exercise — session gains one exercise",
      run:function(a){
        a.wkBeginSession({id:'t2',name:'T',exercises:[]});
        var n=a.document.getElementById('wk-add-ex-name');if(n)n.value='Bench Press';
        a.document.querySelectorAll('#wk-add-ex-types .exercise-tag').forEach(function(t){t.classList.remove('selected');if(t.dataset.type==='lift')t.classList.add('selected');});
        if(typeof a.wkSubmitAddExercise==='function')a.wkSubmitAddExercise();
        else if(typeof a.wkConfirmAddEx==='function')a.wkConfirmAddEx();
        return a._wkSession&&a._wkSession.exercises.length===1;
      }},
    {id:"W.09",type:"auto",label:"Lift card renders kg and reps in wk-today-content",
      run:function(a){var l=a.document.getElementById('wk-today-content');if(!l)return{pass:false,msg:'wk-today-content not found'};var h=l.innerHTML.toLowerCase();return h.includes('kg')&&h.includes('rep');}},
    {id:"W.10",type:"auto",label:"Bodyweight exercise type sets correctly",
      run:function(a){
        if(!a._wkSession)a.wkBeginSession({id:'bw',name:'BW',exercises:[]});
        var n=a.document.getElementById('wk-add-ex-name');if(n)n.value='Sit Ups';
        a.document.querySelectorAll('#wk-add-ex-types .exercise-tag').forEach(function(t){t.classList.remove('selected');if(t.dataset.type==='bodyweight')t.classList.add('selected');});
        if(typeof a.wkSubmitAddExercise==='function')a.wkSubmitAddExercise();
        else if(typeof a.wkConfirmAddEx==='function')a.wkConfirmAddEx();
        var ex=a._wkSession&&a._wkSession.exercises[a._wkSession.exercises.length-1];
        return ex&&ex.type==='bodyweight';
      }},
    {id:"W.11",type:"auto",label:"Cardio-distance exercise has distanceKm property",
      run:function(a){
        if(!a._wkSession)a.wkBeginSession({id:'run',name:'R',exercises:[]});
        var n=a.document.getElementById('wk-add-ex-name');if(n)n.value='Morning Run';
        a.document.querySelectorAll('#wk-add-ex-types .exercise-tag').forEach(function(t){t.classList.remove('selected');if(t.dataset.type==='cardio-distance')t.classList.add('selected');});
        if(typeof a.wkSubmitAddExercise==='function')a.wkSubmitAddExercise();
        else if(typeof a.wkConfirmAddEx==='function')a.wkConfirmAddEx();
        var ex=a._wkSession&&a._wkSession.exercises[a._wkSession.exercises.length-1];
        return ex&&'distanceKm'in ex;
      }},
    {id:"W.12",type:"auto",label:"Rehab exercise has rounds not sets",
      run:function(a){
        if(!a._wkSession)a.wkBeginSession({id:'rh',name:'R',exercises:[]});
        var n=a.document.getElementById('wk-add-ex-name');if(n)n.value='Calf Raise';
        a.document.querySelectorAll('#wk-add-ex-types .exercise-tag').forEach(function(t){t.classList.remove('selected');if(t.dataset.type==='rehab')t.classList.add('selected');});
        if(typeof a.wkSubmitAddExercise==='function')a.wkSubmitAddExercise();
        else if(typeof a.wkConfirmAddEx==='function')a.wkConfirmAddEx();
        var ex=a._wkSession&&a._wkSession.exercises[a._wkSession.exercises.length-1];
        return ex&&'rounds'in ex&&!('sets'in ex);
      }},
    {id:"W.13",type:"auto",label:"wkCardioDistInput does NOT re-render on input",
      run:function(a){var f=(a.wkCardioDistInput||'').toString();return f&&!f.includes('wkRenderToday')&&!f.includes('renderExerciseLog');}},
    {id:"W.13b",type:"auto",label:"wkTickSet does NOT call wkRenderToday",
      run:function(a){var f=(a.wkTickSet||'').toString();return f&&!f.includes('wkRenderToday');}},
    {id:"W.13c",type:"auto",label:"wkAddSet does NOT call wkRenderToday",
      run:function(a){var f=(a.wkAddSet||'').toString();return f&&!f.includes('wkRenderToday');}},
    {id:"W.14",type:"auto",label:"endWorkout saves to state.workoutLog",
      run:function(a){
        a.wkBeginSession({id:'end',name:'End',exercises:[]});
        var dk=new Date().toISOString().slice(0,10);
        if(typeof a.wkEndSession==='function')a.wkEndSession(true);
        else if(typeof a.wkConfirmEnd==='function')a.wkConfirmEnd();
        var log=a.state.workoutLog||a.state.workouts;
        if(!log)return{pass:false,msg:'no workoutLog in state'};
        if(Array.isArray(log))return log.length>0;
        return!!log[dk];
      }},
    {id:"W.15",type:"auto",label:"workoutSchedule persists via saveState",
      run:function(a){
        if(!a.state.workoutSchedule)a.state.workoutSchedule={};
        a.state.workoutSchedule['2026-10-19']={0:'test-id'};
        a.saveState();
        var s=JSON.parse(a.localStorage.getItem('fitsol_v2')||'{}');
        return s.workoutSchedule&&s.workoutSchedule['2026-10-19']&&s.workoutSchedule['2026-10-19'][0]==='test-id';
      }},
    {id:"W.16",type:"semi",label:"Today tab shows today's date (not 'week of')",run:null},
    {id:"W.17",type:"semi",label:"Plans tab renders week grid and day schedule rows",run:null},
    {id:"W.18",type:"semi",label:"History tab — Exercise Progress shows chart",run:null},
    {id:"W.19",type:"manual",label:"Add exercise via UI — appears as card in Today tab (test each type)",run:null},
    {id:"W.20",type:"manual",label:"Run card: can type more than one digit in km field",run:null},
    {id:"W.21",type:"manual",label:"Pace calculates correctly (3km / 18:00 = 6:00/km)",run:null},
    {id:"W.22",type:"manual",label:"Session timer ticks up every second",run:null},
    {id:"W.23",type:"manual",label:"End session — confirm sheet appears, session saved to History",run:null},
    {id:"W.24",type:"manual",label:"Navigate away from workout mid-session, return — session still active",run:null},
    {id:"W.25",type:"manual",label:"Plans: tap a day — picker opens with saved workouts + Rest + Clear",run:null},
    {id:"W.26",type:"manual",label:"Plans: save as template, load on different week — fills correctly",run:null},
    {id:"W.27",type:"manual",label:"Use Plan — loads saved workout exercises into session",run:null},
  ]},
  { id:'P', title:"Progress screen", color:"#C084FC", tests:[
    {id:"P.01",type:"auto",label:"renderTrends function exists",run:function(a){return typeof a.renderTrends==='function';}},
    {id:"P.02",type:"auto",label:"renderGoals function exists",run:function(a){return typeof a.renderGoals==='function';}},
    {id:"P.03",type:"auto",label:"state.weightLog is an array",run:function(a){return Array.isArray(a.state.weightLog);}},
    {id:"P.04",type:"auto",label:"drawLineChart renders SVG into a container",
      run:function(a){
        if(typeof a.drawLineChart!=='function')return false;
        var el=a.document.createElement('div');
        a.document.body.appendChild(el);
        try{a.drawLineChart(el,[70,71,70.5,69.8],'#C084FC');}catch(e){return{pass:false,msg:e.message};}
        a.document.body.removeChild(el);
        return true;
      }},
    {id:"P.05",type:"auto",label:"saveGoal function exists",run:function(a){return typeof a.saveGoal==='function';}},
    {id:"P.06",type:"auto",label:"toggleMilestone function exists",run:function(a){return typeof a.toggleMilestone==='function';}},
    {id:"P.07",type:"semi",label:"Weight trend chart renders with data from test data",run:null},
    {id:"P.08",type:"semi",label:"Goals list renders from test data",run:null},
    {id:"P.09",type:"manual",label:"Log weight — appears in chart and updates current weight",run:null},
    {id:"P.10",type:"manual",label:"Add goal with milestone — appears in goals list",run:null},
    {id:"P.11",type:"manual",label:"Tick a milestone — marks as done",run:null},
    {id:"P.12",type:"manual",label:"Trend period toggle (1W / 1M / 3M) — chart updates",run:null},
  ]},
  { id:'S', title:"Settings & onboarding", color:"#F87171", tests:[
    {id:"S.01",type:"auto",label:"saveSettings function exists",run:function(a){return typeof a.saveSettings==='function';}},
    {id:"S.02",type:"auto",label:"calcAuto returns correct macros for 2000 cal balanced",
      run:function(a){
        if(typeof a.calcAuto!=='function')return false;
        var r=a.calcAuto(2000,'balanced');
        var check=Math.abs((r.protein*4)+(r.carbs*4)+(r.fat*9)-2000)<10;
        return check;
      }},
    {id:"S.03",type:"auto",label:"calcFixProtein returns correct macros",
      run:function(a){if(typeof a.calcFixProtein!=='function')return false;var r=a.calcFixProtein(2000,150,'balanced');return r&&'carbs'in r&&'fat'in r;}},
    {id:"S.04",type:"auto",label:"exportData function exists",run:function(a){return typeof a.exportData==='function';}},
    {id:"S.05",type:"auto",label:"clearData / doFullReset functions exist",
      run:function(a){return typeof a.clearData==='function'||typeof a.doFullReset==='function';}},
    {id:"S.06",type:"semi",label:"Settings screen shows correct current macro targets",run:null},
    {id:"S.07",type:"manual",label:"Change macro mode (Auto/Custom) — targets update and save",run:null},
    {id:"S.08",type:"manual",label:"Change name/weight in settings — reflects on Home screen",run:null},
  ]},
];

var results={};
var comments={};
var running=false;
var app=null;
var sectionFilter='all';

function log(msg,type){var b=document.getElementById('log-box');var l=document.createElement('span');l.className='log-line '+(type||'info');l.textContent=msg;b.appendChild(l);b.appendChild(document.createElement('br'));b.scrollTop=b.scrollHeight;}
function onFrameLoad(){try{app=document.getElementById('app-frame').contentWindow;log('App loaded','ok');}catch(e){log('Frame error: '+e.message,'err');}}
function resetApp(){try{document.getElementById('app-frame').contentWindow.localStorage.removeItem('fitsol_v2');}catch(e){}document.getElementById('app-frame').src='index.html';log('App reset','info');}
function loadTestData(){if(!app){log('App not loaded','err');return;}try{if(typeof window.seedTestData==='function'){window.seedTestData(app);app.location.reload();log('Test data loaded — reloading app','ok');}else{log('seedTestData not found — is testdata.js loaded?','err');}}catch(e){log('Error: '+e.message,'err');}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function setResult(id,status,msg){results[id]={status:status,msg:msg||null};}
function clearResults(){results={};var b=document.getElementById('log-box');b.innerHTML='<span class="log-line info">Cleared.</span>';render();}
function setSection(s,el){sectionFilter=s;document.querySelectorAll('.sf-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');render();}
function setComment(id,val){if(val.trim())comments[id]=val.trim();else delete comments[id];}
function toggleManual(id,event){if(event&&event.target&&event.target.tagName==='TEXTAREA')return;var c=(results[id]||{}).status;if(c==='pass')setResult(id,'fail');else if(c==='fail')delete results[id];else setResult(id,'pass');render();}

async function runAll(){
  if(running)return;
  running=true;
  document.getElementById('btn-run-all').disabled=true;
  log('--- Running auto tests ---','info');
  var auto=SECTIONS.flatMap(function(s){return s.tests;}).filter(function(t){return t.type==='auto';});
  for(var i=0;i<auto.length;i++){
    var t=auto[i];
    setResult(t.id,'running');render();
    await sleep(60);
    try{
      if(!app)throw new Error('App not loaded');
      var r=t.run(app);
      var pass,msg;
      if(r&&typeof r==='object'&&'pass'in r){pass=r.pass;msg=r.msg;}else{pass=!!r;msg=null;}
      setResult(t.id,pass?'pass':'fail',msg||(pass?null:'returned falsy'));
      log((pass?'✓':'✗')+' '+t.id,pass?'ok':'err');
    }catch(e){setResult(t.id,'fail',e.message);log('✗ '+t.id+' ERROR: '+e.message,'err');}
    await sleep(40);
  }
  log('--- Done ---','info');
  running=false;
  document.getElementById('btn-run-all').disabled=false;
  render();
}

function exportResults(){
  var all=SECTIONS.flatMap(function(s){return s.tests;});
  var lines=['FitSoleil Test Report — '+new Date().toLocaleString(),''];
  var pass=0,fail=0,pending=0;
  SECTIONS.forEach(function(s){
    lines.push('## '+s.title);
    s.tests.forEach(function(t){
      var r=results[t.id]||{};var st=r.status||'pending';
      var icon=st==='pass'?'✓':st==='fail'?'✗':'○';
      var cmt=comments[t.id]?' // '+comments[t.id]:'';
      lines.push('  '+icon+' '+t.id+' ['+t.type.toUpperCase()+'] '+t.label+cmt);
      if(r.msg)lines.push('    ERROR: '+r.msg);
      if(st==='pass')pass++;else if(st==='fail')fail++;else pending++;
    });
    lines.push('');
  });
  lines.push('SUMMARY: '+pass+' pass, '+fail+' fail, '+pending+' pending');
  var text=lines.join('\n');
  navigator.clipboard.writeText(text).then(function(){log('Report copied — paste into Claude','ok');}).catch(function(){log('Clipboard failed','err');});
}

function render(){
  var all=SECTIONS.flatMap(function(s){return s.tests;});
  var auto=all.filter(function(t){return t.type==='auto';});
  var pass=all.filter(function(t){return(results[t.id]||{}).status==='pass';}).length;
  var fail=all.filter(function(t){return(results[t.id]||{}).status==='fail';}).length;
  var aPass=auto.filter(function(t){return(results[t.id]||{}).status==='pass';}).length;
  var aDone=auto.filter(function(t){var s=(results[t.id]||{}).status;return s==='pass'||s==='fail';}).length;
  var pct=aDone?Math.round(aPass/aDone*100):0;
  document.getElementById('s-total').textContent=all.length;
  document.getElementById('s-pass').textContent=pass;
  document.getElementById('s-fail').textContent=fail;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=aPass+'/'+auto.length+' auto ('+pct+'%)';

  var html='';
  SECTIONS.forEach(function(s){
    if(sectionFilter!=='all'&&sectionFilter!=='fail'&&s.id!==sectionFilter)return;
    var visible=s.tests.filter(function(t){
      if(sectionFilter==='fail')return(results[t.id]||{}).status==='fail';
      return true;
    });
    if(!visible.length)return;
    var sp=s.tests.filter(function(t){return(results[t.id]||{}).status==='pass';}).length;
    var sf=s.tests.filter(function(t){return(results[t.id]||{}).status==='fail';}).length;
    var su=s.tests.length-sp-sf;
    var cnt='';
    if(sf)cnt+='<span style="color:#F87171">'+sf+' fail &middot; </span>';
    cnt+='<span style="color:#4ADE80">'+sp+' pass</span>';
    cnt+=' &middot; <span style="color:#5A5860">'+su+' pending</span>';
    html+='<div class="section"><div class="section-hdr" style="color:'+s.color+'"><span>'+s.title+'</span><span>'+cnt+'</span></div>';
    visible.forEach(function(t){
      var r=results[t.id]||{};var st=r.status||'';
      var cb='';
      if(st==='pass')cb='<div class="cb pass">&#10003;</div>';
      else if(st==='fail')cb='<div class="cb fail">&#10007;</div>';
      else if(st==='running')cb='<div class="cb running">&#9679;</div>';
      else cb='<div class="cb"></div>';
      var badge=t.type==='auto'?'<span class="badge b-auto">AUTO</span>':t.type==='semi'?'<span class="badge b-semi">SEMI</span>':'<span class="badge b-manual">MANUAL</span>';
      var onclick=t.type!=='auto'?'onclick="toggleManual(\''+t.id+'\',event)"':'';
      var errHtml=r.msg?'<div class="err-msg">'+r.msg+'</div>':'';
      var commentHtml='';
      if(t.type!=='auto'){
        commentHtml='<textarea class="comment-input" rows="1" placeholder="Add note..." onclick="event.stopPropagation()" oninput="setComment(\''+t.id+'\',this.value)">'+(comments[t.id]||'')+'</textarea>';
      }else if(comments[t.id]){
        commentHtml='<div style="font-size:9px;color:#5A5860;margin-top:2px">&#128203; '+comments[t.id]+'</div>';
      }
      html+='<div class="test '+st+'" '+onclick+'>'+cb+'<span class="id">'+t.id+'</span><div class="label">'+t.label+badge+errHtml+commentHtml+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('checklist').innerHTML=html;
}
render();
</script>
</body>
</html>
